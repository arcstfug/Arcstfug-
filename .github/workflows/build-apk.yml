name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version output: ${JAVA_VER_OUTPUT}"
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*.*".*/\1/')
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to detect active Java major version from: ${JAVA_VER_OUTPUT}"
            exit 1
          fi
          echo "Detected active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Active Java major version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi
          echo "Confirmed Java major version is ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary ./debug.keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists; skipping generation."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore (./debug.keystore) could not be created or does not exist."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK paths:"
              find app/build/outputs/apk -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path (${EXPECTED_APK}) is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Confirmed verified debug APK at ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${VERIFIED_APK}" ] || [ ! -s "${VERIFIED_APK}" ]; then
            echo "::error::Verified APK is missing or empty before preparing release asset."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "${SANITIZED_REPO_NAME}" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${TEMP_ASSET_DIR}"

          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"
          cp "${VERIFIED_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy verified APK to temporary release asset path: ${ASSET_PATH}"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset does not exist at ${ASSET_PATH}. Skipping release creation."
            exit 1
          fi

          if [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset at ${ASSET_PATH} is empty. Skipping release creation."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset (${ASSET_PATH}) is not a .apk file. Skipping release creation."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **Workflow Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Intended Purpose:** Intended for testing only
          - **Production Status:** Not a Play Store production release
          - **Signing Info:** Signed only with a temporary debug keystore
          EOF
          )

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          if ! gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_NAME}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest; then
            echo "::warning::GitHub Release creation failed for tag ${RELEASE_TAG}. The debug APK build and Actions artifact upload succeeded."
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREPARE_OUTCOME="${{ steps.prepare_asset.outcome }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${PREPARE_OUTCOME}" != "success" ]; then
            echo "::error::The Gradle debug APK build step did not complete successfully. Check the 'Build debug APK' step logs above."
            {
              echo "## Debug APK Build Summary"
              echo "- **APK Build Status:** Failed (see \`Build debug APK\` step logs)"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ "${RELEASE_OUTCOME}" = "success" ] && gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url)
            echo "=== GitHub Release Published Successfully ==="
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            echo "You can download the APK directly from the release Assets section."
            echo "The normal GitHub Actions artifact (app-debug-apk) is also available as a backup."

            {
              echo "## Debug APK Build & Release Summary"
              echo "- **APK Build & Artifact Upload:** Succeeded"
              echo "- **GitHub Release Status:** Succeeded"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Direct GitHub Release Page URL:** [${RELEASE_URL}](${RELEASE_URL})"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "The APK can be downloaded directly on a phone from the **Assets** section of the GitHub Release page linked above."
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run page as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing did not succeed. However, the debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available for download."
            echo "=== APK Build Succeeded (Release Publishing Failed) ==="
            echo "The APK build and artifact upload succeeded."
            echo "Backup Download: Download the 'app-debug-apk' artifact from the GitHub Actions workflow run summary page."

            {
              echo "## Debug APK Build & Release Summary"
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed, but the **APK build and GitHub Actions artifact upload succeeded**."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact Name:** \`app-debug-apk\` (available now)"
              echo "- **GitHub Release Status:** Failed (see step logs for details)"
              echo ""
              echo "### How to Download Your Debug APK"
              echo "You can still download the built debug APK from the **Artifacts** section of this workflow run by selecting **\`app-debug-apk\`**."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
